[package]
name = "xmip-core-transport-dds"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-transport-dds"
description = "DDS transport: RTPS over UDP — DATA submessages carry a sample whole and DATA_FRAG submessages carry it in fragments reassembled by sequence number; a Location is a participant's unicast locator; an in-process reader stands in for the domain. A xmip-core-transport technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). Standard library otherwise: the framing is bytes
# and the loopback is in this process. Its declaration takes the
# capability's `timeout` (`transport::configured::timeout`).
transport = { workspace = true }
# The settings this technology declares (xcore::settings), read through
# transport::Configured (ADR-0064, amendment 2026-09-26).
xcore = { workspace = true }

# The datagram is udp's (architecture.toml: dds depends on udp); the RTPS
# message inside it is this crate's. The code's alone: the declaration
# takes no setting from it.
udp = { workspace = true, optional = true }
# The estate's encoding primitives: a GUID prefix written as hex.
codec = { workspace = true, optional = true }
# The most a connection is read for: the ceiling a fragmented sample's
# announced size is held to before it is allocated.
net = { workspace = true, optional = true }

[features]
# The code and its declaration: the transport guide's "The declaration",
# module/core/capability/transport/doc/adding-a-transport.md.
default = ["declaration", "dep:udp", "dep:codec", "dep:net"]
# The declaration alone, with the read window and the socket's hold its
# defaults name.
declaration = []

[dev-dependencies]
# The loopback payloads the tests drive, from the capability's test
# support and never a production build (ADR-0044).
transport = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
